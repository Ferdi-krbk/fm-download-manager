name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '!v3.8.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Fetch Bundled Tools (yt-dlp, ffmpeg, ffprobe)
      shell: pwsh
      run: ./scripts/fetch-tools.ps1

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build -c Release --no-restore

    - name: Check fonts, window sizing and smooth scrolling
      run: dotnet run -c Release --project tests/McDm.Acceptance -- --ui-only dist/ui-polish-checks

    - name: Run test suite
      run: dotnet run -c Release --project tests/McDm.Tests

    - name: Run extension tests
      shell: pwsh
      run: |
        foreach ($testFile in Get-ChildItem tests -Filter 'test_*.js') {
          node $testFile.FullName
          if ($LASTEXITCODE -ne 0) { throw "Extension test failed: $($testFile.Name)" }
        }

    - name: Run Windows acceptance checks
      run: dotnet run -c Release --project tests/McDm.Acceptance -- dist/ci-acceptance dist/ci-screenshots

    - name: Install browser UI test dependencies
      working-directory: tests/ui
      run: |
        npm ci
        npx playwright install chromium

    - name: Check extension UI in an isolated browser
      working-directory: tests/ui
      env:
        MCDM_SAMPLE_VIDEO: dist/ci-acceptance/fixtures/sample-clip.mp4
      run: npm test

    - name: Upload acceptance results
      uses: actions/upload-artifact@v4
      with:
        name: Acceptance-results
        path: dist/ci-acceptance/results.txt

    - name: Publish Self-Contained (win-x64)
      run: dotnet publish src/McDm.App/McDm.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64

    - name: Publish Framework-Dependent
      run: dotnet publish src/McDm.App/McDm.App.csproj -c Release -o publish/framework-dependent

    - name: Compile Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer/setup.iss

    - name: Test installed package on disposable Windows runner
      shell: pwsh
      run: ./scripts/test-installed-package.ps1 -InstallerPath dist/FMDownloadManager-Setup-1.0.0.exe

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FMDownloadManager-Setup
        path: dist/FMDownloadManager-Setup-*.exe

    - name: Generate Winget manifest
      shell: pwsh
      run: |
        [xml]$project = Get-Content src/McDm.App/McDm.App.csproj
        $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
        if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and project version differ' }
        ./scripts/generate-winget.ps1 -Version $version -InstallerPath "dist/FMDownloadManager-Setup-$version.exe"

    - name: Upload Winget manifest
      uses: actions/upload-artifact@v4
      with:
        name: FMDownloadManager-Winget
        path: dist/winget/*.yaml

    - name: Write release checksums
      shell: pwsh
      run: |
        Get-ChildItem dist -Filter 'FMDownloadManager-Setup-*.exe' | ForEach-Object {
          $sha = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($_.Name)"
        } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii

    - name: Sign official update manifest
      if: startsWith(github.ref, 'refs/tags/v') && !github.event.forced
      shell: pwsh
      env:
        FM_UPDATE_SIGNING_KEY: ${{ secrets.FM_UPDATE_SIGNING_KEY }}
      run: |
        [xml]$project = Get-Content src/McDm.App/McDm.App.csproj
        $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
        $build = [int](($project.Project.ItemGroup.AssemblyMetadata | Where-Object Include -eq 'StableBuild' | Select-Object -First 1).Value)
        ./scripts/sign-update.ps1 -AssetPath "dist/FMDownloadManager-Setup-$version.exe" -Version $version -Build $build

    - name: Release on tag
      # Updating an existing official release after a forced retag uses maintainer credentials.
      if: startsWith(github.ref, 'refs/tags/v') && !github.event.forced
      uses: softprops/action-gh-release@v2
      with:
        name: FM Download Manager ${{ github.ref_name }}
        body_path: release_notes_v1.md
        make_latest: true
        prerelease: false
        files: |
          dist/FMDownloadManager-Setup-*.exe
          dist/winget/*.yaml
          dist/SHA256SUMS.txt
          dist/update-manifest.json
          dist/update-manifest.sig
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish legacy automatic-update bridge
      if: github.ref == 'refs/tags/v1.0.0' && !github.event.forced
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FM_UPDATE_SIGNING_KEY: ${{ secrets.FM_UPDATE_SIGNING_KEY }}
      run: |
        ./scripts/build-legacy-bootstrap.ps1 -InstallerPath dist/FMDownloadManager-Setup-1.0.0.exe
        if ($LASTEXITCODE -ne 0) { throw 'Bridge verification failed' }
        [xml]$project = Get-Content src/McDm.App/McDm.App.csproj
        $stableBuild = [string](($project.Project.ItemGroup.AssemblyMetadata | Where-Object Include -eq 'StableBuild' | Select-Object -First 1).Value)
        if ([int]$stableBuild -lt 1) { throw 'Stable build metadata is missing' }
        ./scripts/sign-update.ps1 -AssetPath dist/legacy-bridge/FM-Legacy-Update.exe -Version 1.0.0 -Build ([int]$stableBuild)
        $notes = @'
        This compatibility update installs FM Download Manager 1.0.0. Accept the update in your existing app; downloading and installation then complete automatically. The 3.8.1 tag only lets old numeric-only updaters discover 1.0.0.

        FM_STABLE_TARGET=1.0.0
        FM_STABLE_BUILD=__STABLE_BUILD__

        Official release: https://github.com/Ferdi-krbk/fm-download-manager/releases/tag/v1.0.0
        The embedded official installer is SHA-256 checked before installation. Existing update confirmation and Windows security prompts still apply. Settings and history are preserved. Reload an unpacked browser extension after updating.
        '@
        $notes = $notes.Replace('__STABLE_BUILD__', $stableBuild)
        $notes | Set-Content dist/legacy-bridge/release-notes.md -Encoding utf8
        $sha = (Get-FileHash dist/legacy-bridge/FM-Legacy-Update.exe -Algorithm SHA256).Hash.ToLowerInvariant()
        "$sha  FM-Legacy-Update.exe" | Set-Content dist/legacy-bridge/SHA256SUMS.txt -Encoding ascii
        gh release view v3.8.1 --repo $env:GITHUB_REPOSITORY *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create v3.8.1 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'FM Download Manager 1.0.0 - update compatibility' --notes-file dist/legacy-bridge/release-notes.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Bridge release creation failed' }
        }
        gh release upload v3.8.1 dist/legacy-bridge/FM-Legacy-Update.exe dist/legacy-bridge/SHA256SUMS.txt dist/legacy-bridge/update-manifest.json dist/legacy-bridge/update-manifest.sig --repo $env:GITHUB_REPOSITORY --clobber
        if ($LASTEXITCODE -ne 0) { throw 'Bridge upload failed' }
        # Refresh the historical compatibility URL too, for clients with a cached offer.
        gh release upload v3.8.0 dist/legacy-bridge/FM-Legacy-Update.exe dist/legacy-bridge/SHA256SUMS.txt dist/legacy-bridge/update-manifest.json dist/legacy-bridge/update-manifest.sig --repo $env:GITHUB_REPOSITORY --clobber
        if ($LASTEXITCODE -ne 0) { throw 'Cached bridge upload failed' }
        gh release edit v3.8.0 --repo $env:GITHUB_REPOSITORY --notes-file dist/legacy-bridge/release-notes.md --prerelease --latest=false
        if ($LASTEXITCODE -ne 0) { throw 'Cached bridge metadata update failed' }
        gh release edit v3.8.1 --repo $env:GITHUB_REPOSITORY --title 'FM Download Manager 1.0.0 - update compatibility' --notes-file dist/legacy-bridge/release-notes.md --latest
        if ($LASTEXITCODE -ne 0) { throw 'Bridge promotion failed' }
